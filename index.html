<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tic Tac Toe</title>
    <link rel="stylesheet" href="style.css">
    <link rel="shortcut icon" href="https://img.icons8.com/?size=512&id=9457&format=png" type="image/x-icon">
</head>
<body>
    <nav>
        <ul class="welcomemessage">
            # Tic Tac Toe
        </ul>
    </nav>
    <img src="bluebrush.png" id="bluebrush">
   
   <div class="gameContainer">
       <div class="container">
           <img src="brush.png" id="winLine">
           <div class="box bt bl"><span class="boxsign"></span></div>
           <div class="box bt"><span class="boxsign"></span></div>
           <div class="box bt br"><span class="boxsign"></span></div>
           <div class="box bl"><span class="boxsign"></span></div>
           <div class="box"><span class="boxsign"></span></div>
           <div class="box br"><span class="boxsign"></span></div>
           <div class="box bb bl"><span class="boxsign"></span></div>
           <div class="box bb"><span class="boxsign"></span></div>
           <div class="box bb br"><span class="boxsign"></span></div>
        </div>
</div>
<div class="infoText">
    Turn for X
</div>
<button id="btnRestart">Restart</button>
<!-- <span id="countdown"></span> -->

<script src="script.js"></script>
    
</body>
</html>
